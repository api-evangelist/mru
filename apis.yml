name: MRU
description: MRU Holdings, Inc. (operating as MyRichUncle) was a specialty education-finance
  company founded in 2001 and headquartered in New York that became one of the largest
  private student-loan providers in the United States. It ceased offering student-loan
  products in September 2008 and filed for Chapter 7 bankruptcy in February 2009. Battery
  Ventures participated in the company's 2005 PIPE financing. The company is defunct and
  publishes no live website, public API, or developer surface.
